<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora Dora - EdTech Learning App & Admin Panel</title>
    
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 860px;
            background-color: #0f0f0f;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border-radius: 40px;
        }

        .phone-container::-webkit-scrollbar {
            display: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            min-height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* LOGIN SCREEN */
        .login-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #212121 100%);
        }

        .login-logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;
            font-family: serif;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
            display: block;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
        }

        .btn-full {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            background: #ff0000;
            color: #fff;
            margin-top: 10px;
        }

        /* SEARCH BAR */
        .search-box {
            padding: 10px 15px;
            background: #0f0f0f;
            position: sticky;
            top: 57px;
            z-index: 9;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
        }

        /* HEADERS & NAVIGATION */
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f0f0f;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .home-logo {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            letter-spacing: 1px;
        }

        .icon-btn {
            background: #222;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .feed-container {
            padding: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
        }

        /* STATS CARD FOR ADMIN */
        .admin-stats-box {
            background: #181818;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* COURSE CARD WITH FAVOURITE HEART (16:9) */
        .course-grid-card {
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            border: 1px solid #222;
        }

        .course-thumb-container {
            position: relative;
            width: 100%;
            height: 160px;
            cursor: pointer;
        }

        .course-grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
        }

        .course-grid-info {
            padding: 12px;
            cursor: pointer;
        }

        .course-grid-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }

        .course-grid-desc {
            font-size: 11px;
            color: #aaa;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* FOLDER CARDS (SUBJECTS) */
        .folder-card {
            background: #181818;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            cursor: pointer;
        }

        /* YOUTUBE LIST STYLE LECTURE ITEM */
        .yt-list-item {
            display: flex;
            gap: 12px;
            background: #181818;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #262626;
            cursor: pointer;
        }

        .yt-list-thumb {
            width: 130px;
            height: 75px;
            border-radius: 6px;
            object-fit: cover;
            background: #000;
            flex-shrink: 0;
            position: relative;
        }

        .yt-list-duration {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .yt-list-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .yt-list-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .yt-list-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .action-chip {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-chip:hover {
            background: #ff0000;
            border-color: #ff5555;
        }

        .back-nav-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .back-btn {
            background: #222;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }

        /* ADMIN STYLES */
        .admin-screen {
            padding: 20px;
            background: #0f0f0f;
            overflow-y: auto;
        }

        .admin-row {
            background: #181818;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .sub-page {
            display: none;
            flex-direction: column;
            min-height: 100%;
            background: #0f0f0f;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            overflow-y: auto;
            padding: 20px;
        }
        .sub-page.active {
            display: flex;
        }

        /* FULL SCREEN MODAL & PLAYER */
        .modal-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .modal-container.active { display: flex; }
        
        .modal-body {
            position: relative;
            width: 100%;
            height: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        .modal-body video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* FIXED TELEGRAM FLOATING ICON BUTTON */
        .floating-tg-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #24a1ee;
            color: #ffffff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(36, 161, 238, 0.6);
            z-index: 999;
            text-decoration: none;
            transition: transform 0.2s ease;
            border: 2px solid #ffffff;
        }
        .floating-tg-btn:hover {
            transform: scale(1.08);
        }
        .floating-tg-btn svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen login-screen active">
            <div class="login-logo">DORA DORA</div>
            <div class="login-subtitle">EdTech Learning Portal</div>
            
            <div class="input-group">
                <label>Mobile Number (10 Digit)</label>
                <input type="text" id="loginUser" placeholder="Enter 10 digit mobile number" maxlength="10">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>

            <button class="btn-full" onclick="handleLogin()">Sign In</button>
        </div>

        <!-- USER HOME SCREEN (COURSES) -->
        <div id="homeScreen" class="screen">
            <div class="home-header">
                <div class="home-logo">DORA DORA</div>
                <button class="icon-btn" onclick="handleLogout()">Logout</button>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" placeholder="🔍 Search courses..." oninput="filterCourses(this.value)">
            </div>
            <div class="feed-container">
                <div class="section-title">My Favourites ⭐</div>
                <div id="favCoursesContainer" style="margin-bottom: 20px;"></div>

                <div class="section-title">Available Courses</div>
                <div id="coursesGridContainer"></div>
            </div>

            <!-- FIXED TELEGRAM FLOATING ICON BUTTON -->
            <a id="floatingTgBtn" href="https://t.me/" target="_blank" class="floating-tg-btn" title="Join Telegram">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.02-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.23-3.55 3.91-1.66 4.72-1.95 5.25-1.96.12 0 .38.03.55.17.14.12.18.28.2.4-.02.07-.02.13-.04.28z"/>
                </svg>
            </a>
        </div>

        <!-- SUBJECT LIST SCREEN (USER) -->
        <div id="subjectScreen" class="screen">
            <div class="back-nav-bar">
                <button class="back-btn" onclick="switchScreen('homeScreen')">‹ Courses</button>
                <span id="navCourseTitleHeader" style="font-size:12px; font-weight:bold; color:#fff;">COURSE</span>
                <div style="width:40px;"></div>
            </div>
            <div class="feed-container">
                <div class="section-title">Subjects</div>
                <div id="subjectsContainer"></div>
            </div>
        </div>

        <!-- LECTURES & ATTACHED FILES SCREEN (USER) -->
        <div id="lectureScreen" class="screen">
            <div class="back-nav-bar">
                <button class="back-btn" onclick="openSubjectList()">‹ Subjects</button>
                <span id="navSubjectTitleHeader" style="font-size:12px; font-weight:bold; color:#fff;">SUBJECT</span>
                <div style="width:40px;"></div>
            </div>
            <!-- SEARCH BAR FOR LECTURES -->
            <div class="search-box" style="top: 0; background: #0f0f0f;">
                <input type="text" class="search-input" id="lectureSearchInput" placeholder="🔍 Search lectures by title..." oninput="filterLectures(this.value)">
            </div>
            <div class="feed-container">
                <div class="section-title">Lectures & Study Files</div>
                <div id="lecturesContainer"></div>
            </div>
        </div>

        <!-- ================= ADMIN PANEL SCREENS ================= -->

        <!-- ADMIN PANEL HOME -->
        <div id="adminScreen" class="screen admin-screen">
            <div class="admin-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #222; padding-bottom:10px;">
                <h2 style="font-size:16px; color:#ff0000;">Admin Dashboard</h2>
                <button class="icon-btn" onclick="handleLogout()">Logout</button>
            </div>

            <!-- TOTAL REGISTERED USERS COUNT BOX -->
            <div class="admin-stats-box">
                <div>
                    <div style="font-size:11px; color:#aaa;">Total Registered Users</div>
                    <div id="totalUsersCount" style="font-size:20px; font-weight:bold; color:#24a1ee;">0</div>
                </div>
                <div style="font-size:24px;">👥</div>
            </div>

            <!-- TELEGRAM LINK SETTING BOX -->
            <div style="background:#181818; padding:12px; border-radius:8px; border:1px solid #333; margin-bottom:15px;">
                <label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">Telegram Channel Link</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="adminTgLinkInput" placeholder="https://t.me/yourchannel" style="flex:1; padding:8px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; font-size:11px;">
                    <button onclick="saveTelegramLink()" style="background:#0088cc; color:white; border:none; padding:8px 12px; border-radius:6px; font-size:11px; cursor:pointer; font-weight:bold;">Save</button>
                </div>
            </div>

            <button class="btn-full" style="margin-bottom:15px;" onclick="openAddCoursePage()">+ Add New Course</button>
            <div class="section-title">All Courses</div>
            <div id="adminCoursesList"><p style="color:#777; font-size:12px;">Loading courses...</p></div>
        </div>

        <!-- SUB-PAGE: ADD COURSE -->
        <div id="addCoursePage" class="sub-page">
            <div class="back-nav-bar" style="margin:-20px -20px 20px -20px;">
                <button class="back-btn" onclick="closeAddCoursePage()">‹ Cancel</button>
                <span style="font-size:13px; font-weight:bold; color:#ff0000;">Add Course</span>
                <div style="width:40px;"></div>
            </div>
            <div class="input-group"><label>Course Name</label><input type="text" id="newCourseName" placeholder="e.g. SSC CGL Complete Batch"></div>
            <div class="input-group"><label>Description</label><textarea id="newCourseDesc" rows="3" placeholder="Batch overview..."></textarea></div>
            <div class="input-group"><label>Thumbnail Image</label><input type="file" id="newCourseImgFile" accept="image/*"></div>
            <button class="btn-full" onclick="addNewCourse()">Save Course</button>
        </div>

        <!-- SUB-PAGE: MANAGE SUBJECTS -->
        <div id="adminSubjectsPage" class="sub-page">
            <div class="back-nav-bar" style="margin:-20px -20px 20px -20px;">
                <button class="back-btn" onclick="closeAdminSubjects()">‹ Back</button>
                <span id="adminCourseTitle" style="font-size:13px; font-weight:bold; color:#ff0000;">Manage Course</span>
                <button class="icon-btn" style="background:#8b0000; color:#fff;" onclick="deleteCurrentCourse()">Delete Course</button>
            </div>
            <div class="feed-container" style="padding:15px 0;">
                <div class="input-group"><label>Add Subject (e.g. Physics, History)</label><input type="text" id="newSubjectName" placeholder="Subject name"></div>
                <button class="btn-full" style="margin-bottom:20px;" onclick="addNewSubject()">+ Add Subject</button>
                <div class="section-title">Course Subjects</div>
                <div id="adminSubjectsList"></div>
            </div>
        </div>

        <!-- SUB-PAGE: MANAGE LECTURES INSIDE A SUBJECT (DIRECT) -->
        <div id="adminLecturesPage" class="sub-page">
            <div class="back-nav-bar" style="margin:-20px -20px 20px -20px;">
                <button class="back-btn" onclick="openAdminSubjects(activeCourseKey)">‹ Back</button>
                <span id="adminSubjectTitleHeader" style="font-size:13px; font-weight:bold; color:#ff0000;">Subject Lectures</span>
                <button class="icon-btn" style="background:#ff0000; color:#fff; font-weight:bold;" onclick="openAddLecturePage()">+ Add Lecture</button>
            </div>
            <div class="feed-container" style="padding:15px 0;">
                <div class="section-title">Uploaded Lectures</div>
                <div id="adminLecturesList"></div>
            </div>
        </div>

        <!-- SUB-PAGE: ADD / EDIT LECTURE & DETAILS -->
        <div id="editLecturePage" class="sub-page">
            <div class="back-nav-bar" style="margin:-20px -20px 20px -20px;">
                <button class="back-btn" onclick="closeEditLecturePage()">‹ Cancel</button>
                <span style="font-size:13px; font-weight:bold; color:#ff0000;" id="lectureFormHeading">Add Lecture</span>
                <div style="width:40px;"></div>
            </div>
            <input type="hidden" id="editingLecIdx">
            
            <div class="input-group"><label>Lecture Title (e.g. 4. Average [27-5-26])</label><input type="text" id="lecFormTitle" placeholder="e.g. 4. Average"></div>
            <div class="input-group"><label>Description / Topic</label><textarea id="lecFormDesc" rows="2" placeholder="Details..."></textarea></div>
            <div class="input-group"><label>Duration</label><input type="text" id="lecFormDuration" value="45:00"></div>
            
            <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
            <div class="input-group">
                <label style="color:#ff0000; font-weight:bold;">Direct Video URL (Archive.org / MP4 Link)</label>
                <input type="text" id="lecFormVideoUrl" placeholder="Archive video link or mp4 link">
            </div>
            <div class="input-group"><label>Thumbnail Image URL (Optional)</label><input type="text" id="lecFormThumbUrl" placeholder="Paste image link"></div>
            <div class="input-group"><label>Class Notes PDF Link (Direct URL)</label><input type="text" id="lecFormNotesUrl" placeholder="https://.../notes.pdf"></div>
            <div class="input-group"><label>HTML Quiz Link / Content URL</label><input type="text" id="lecFormQuizUrl" placeholder="https://.../quiz.html"></div>

            <button class="btn-full" onclick="saveLectureData()">Save Lecture to Cloud</button>
            <button class="btn-full" id="deleteLecBtn" style="background:#8b0000; margin-top:10px; display:none;" onclick="deleteCurrentLecture()">Delete Lecture</button>
        </div>

    </div>

    <!-- FULLSCREEN UNIVERSAL MEDIA/VIEWER MODAL -->
    <div class="modal-container" id="universalModal">
        <div class="modal-body" id="modalBodyContent"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dora-dora-2e0e6-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let coursesData = {};
        let appSettings = {};
        let allUsersData = {};
        let currentUser = localStorage.getItem('doradoraUser') || null;
        let favourites = JSON.parse(localStorage.getItem('doradoraFavs')) || [];
        let activeCourseKey = null;
        let activeSubjectName = null;

        window.onload = function() {
            // Load global app settings (Telegram link)
            rtdb.ref('settings').on('value', (snapshot) => {
                appSettings = snapshot.val() || {};
                const tgLink = appSettings.telegramLink || 'https://t.me/';
                const floatBtn = document.getElementById('floatingTgBtn');
                if(floatBtn) floatBtn.href = tgLink;
                const adminInput = document.getElementById('adminTgLinkInput');
                if(adminInput) adminInput.value = tgLink;
            });

            // Load registered users count
            rtdb.ref('users').on('value', (snapshot) => {
                allUsersData = snapshot.val() || {};
                const count = Object.keys(allUsersData).length;
                const countElem = document.getElementById('totalUsersCount');
                if(countElem) countElem.innerText = count;
            });

            rtdb.ref('courses').on('value', (snapshot) => {
                coursesData = snapshot.val() || {};
                if (currentUser) {
                    if (currentUser === '1111') {
                        renderAdminCoursesList();
                        if(activeCourseKey && coursesData[activeCourseKey]) {
                            renderAdminSubjectsList();
                            if(activeSubjectName && coursesData[activeCourseKey].subjects[activeSubjectName]) {
                                renderAdminLecturesList();
                            }
                        }
                    } else {
                        renderUserCourses();
                    }
                }
            });

            if (currentUser) {
                if (currentUser === '1111') {
                    switchScreen('adminScreen');
                } else {
                    switchScreen('homeScreen');
                    renderUserCourses();
                }
            } else {
                switchScreen('loginScreen');
            }

            window.addEventListener('popstate', function() {
                if (document.getElementById('universalModal').classList.contains('active')) {
                    closeModal();
                }
            });
        };

        function saveTelegramLink() {
            const link = document.getElementById('adminTgLinkInput').value.trim();
            if(!link) { alert('Enter valid Telegram link'); return; }
            rtdb.ref('settings/telegramLink').set(link, (err) => {
                if(!err) alert('Telegram link updated successfully!');
            });
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            if (!user || !pass) { 
                alert('Please enter both mobile number and password'); 
                return; 
            }

            // Admin Login Check
            if (user === '1111' && pass === '1234') {
                currentUser = '1111';
                localStorage.setItem('doradoraUser', currentUser);
                switchScreen('adminScreen');
                renderAdminCoursesList();
                return;
            }

            // Valid 10-digit Indian Mobile Number Validation (Starts with 6, 7, 8, or 9)
            const phoneRegex = /^[6-9]\d{9}$/;
            if (!phoneRegex.test(user)) {
                alert('Please enter a valid 10-digit Indian mobile number (e.g. 9876543210)');
                return;
            }

            // Check / Register User in Firebase Database to prevent multiple ID creations per number
            const sanitizedPhone = user.replace(/[.#$\/\[\]]/g, '_');
            const userRef = rtdb.ref('users/' + sanitizedPhone);

            userRef.once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    // First time registration with this number
                    userRef.set({
                        phone: user,
                        createdAt: new Date().toISOString()
                    });
                }
                // Proceed to login
                currentUser = user;
                localStorage.setItem('doradoraUser', currentUser);
                renderUserCourses();
                switchScreen('homeScreen');
            });
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('doradoraUser');
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            switchScreen('loginScreen');
        }

        function toggleFavourite(courseKey, event) {
            event.stopPropagation();
            if (favourites.includes(courseKey)) {
                favourites = favourites.filter(k => k !== courseKey);
            } else {
                favourites.push(courseKey);
            }
            localStorage.setItem('doradoraFavs', JSON.stringify(favourites));
            renderUserCourses();
        }

        function renderUserCourses(filterQuery = '') {
            const container = document.getElementById('coursesGridContainer');
            const favContainer = document.getElementById('favCoursesContainer');
            container.innerHTML = '';
            favContainer.innerHTML = '';

            const keys = Object.keys(coursesData);
            if(keys.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No courses available.</p>';
                favContainer.innerHTML = '<p style="color:#777; font-size:12px;">No favourite courses.</p>';
                return;
            }

            let favCount = 0;
            keys.forEach(key => {
                const course = coursesData[key];
                if (filterQuery && !course.name.toLowerCase().includes(filterQuery.toLowerCase())) return;

                const isFav = favourites.includes(key);
                const favHeart = isFav ? '❤️' : '🤍';

                const cardHtml = `
                    <div class="course-grid-card">
                        <button class="fav-btn" onclick="toggleFavourite('${key}', event)">${favHeart}</button>
                        <div class="course-thumb-container" onclick="openCourseSubjects('${key}')">
                            <img src="${course.heroImg}" class="course-grid-img" alt="${course.name}">
                        </div>
                        <div class="course-grid-info" onclick="openCourseSubjects('${key}')">
                            <div class="course-grid-title">${course.name}</div>
                            <div class="course-grid-desc">${course.desc}</div>
                        </div>
                    </div>
                `;

                if (isFav) {
                    favCount++;
                    favContainer.innerHTML += cardHtml;
                }
                container.innerHTML += cardHtml;
            });

            if (favCount === 0) {
                favContainer.innerHTML = '<p style="color:#777; font-size:12px;">Click the heart (🤍) on any course to add to favourites.</p>';
            }
        }

        function filterCourses(query) {
            renderUserCourses(query);
        }

        function openCourseSubjects(courseKey) {
            activeCourseKey = courseKey;
            const course = coursesData[courseKey];
            document.getElementById('navCourseTitleHeader').innerText = course.name;
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';

            const subjects = course.subjects || {};
            const subNames = Object.keys(subjects);

            if(subNames.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No subjects added in this course yet.</p>';
            } else {
                subNames.forEach(sub => {
                    container.innerHTML += `
                        <div class="folder-card" onclick="openUserLectures('${sub}')">
                            <span>📚 <b>${sub}</b></span>
                            <span style="color:#aaa;">Lectures ›</span>
                        </div>
                    `;
                });
            }
            switchScreen('subjectScreen');
        }

        function openSubjectList() {
            if(activeCourseKey) openCourseSubjects(activeCourseKey);
        }

        function openUserLectures(subName) {
            activeSubjectName = subName;
            document.getElementById('navSubjectTitleHeader').innerText = subName;
            document.getElementById('lectureSearchInput').value = '';
            renderLecturesListUI();
            switchScreen('lectureScreen');
        }

        function filterLectures(query) {
            renderLecturesListUI(query);
        }

        function renderLecturesListUI(searchQuery = '') {
            const lecContainer = document.getElementById('lecturesContainer');
            lecContainer.innerHTML = '';

            const subData = coursesData[activeCourseKey].subjects[activeSubjectName] || {};
            let lectures = subData.lectures || [];

            // Automatic Descending Sorting (Latest / Highest Number First)
            lectures.sort((a, b) => {
                const numA = parseFloat(a.title) || 0;
                const numB = parseFloat(b.title) || 0;
                if (numA !== numB) return numB - numA;
                return b.title.localeCompare(a.title);
            });

            let filteredLectures = lectures;
            if (searchQuery.trim() !== '') {
                filteredLectures = lectures.filter(lec => lec.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            if(filteredLectures.length === 0) {
                lecContainer.innerHTML = '<p style="color:#777; font-size:12px;">No lectures found.</p>';
            } else {
                filteredLectures.forEach((lec) => {
                    const originalIdx = (subData.lectures || []).indexOf(lec);
                    const hasNotes = lec.notesUrl ? `<a class="action-chip" href="${lec.notesUrl}" target="_blank">📁 Class Notes</a>` : '';
                    const hasQuiz = lec.quizUrl ? `<a class="action-chip" href="${lec.quizUrl}" target="_blank">📝 Quiz</a>` : '';

                    lecContainer.innerHTML += `
                        <div class="yt-list-item" onclick="openVideoModal(${originalIdx})">
                            <div class="yt-list-thumb">
                                <img src="${lec.thumb || coursesData[activeCourseKey].heroImg}" style="width:100%; height:100%; object-fit:cover;" alt="thumb">
                                <div class="yt-list-duration">${lec.duration || '45:00'}</div>
                            </div>
                            <div class="yt-list-info">
                                <div class="yt-list-title">${lec.title}</div>
                                <div class="yt-list-actions" onclick="event.stopPropagation();">
                                    <a class="action-chip" href="#" onclick="openVideoModal(${originalIdx}); return false;">▶️ Watch</a>
                                    ${hasNotes}
                                    ${hasQuiz}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function openVideoModal(lecIdx) {
            const lec = coursesData[activeCourseKey].subjects[activeSubjectName].lectures[lecIdx];
            const container = document.getElementById('modalBodyContent');
            container.innerHTML = '';

            let videoUrl = lec.videoUrl || '';
            
            if (videoUrl.includes('archive.org/details/')) {
                videoUrl = videoUrl.replace('/details/', '/embed/');
            }

            if (videoUrl.endsWith('.mp4') || videoUrl.includes('.mp4?')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.setAttribute('controlsList', 'nodownload');
                video.src = videoUrl;
                container.appendChild(video);
            } else {
                const iframe = document.createElement('iframe');
                iframe.src = videoUrl;
                iframe.allowFullscreen = true;
                iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
                container.appendChild(iframe);
            }

            history.pushState({ modalOpen: true }, "");
            document.getElementById('universalModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalBodyContent').innerHTML = '';
            document.getElementById('universalModal').classList.remove('active');
        }

        // ================= ADMIN PANEL FUNCTIONS =================

        function renderAdminCoursesList() {
            const container = document.getElementById('adminCoursesList');
            if(!container) return;
            container.innerHTML = '';
            const keys = Object.keys(coursesData);

            if(keys.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No courses found.</p>';
                return;
            }

            keys.forEach(key => {
                const course = coursesData[key];
                container.innerHTML += `
                    <div class="admin-row">
                        <span onclick="openAdminSubjects('${key}')" style="cursor:pointer; flex:1;"><b>${course.name}</b></span>
                        <div style="display:flex; gap:6px;">
                            <button class="icon-btn" onclick="openAdminSubjects('${key}')">Manage</button>
                            <button class="icon-btn" style="background:#8b0000;" onclick="deleteCourse('${key}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function openAddCoursePage() { 
            document.getElementById('newCourseName').value = '';
            document.getElementById('newCourseDesc').value = '';
            document.getElementById('newCourseImgFile').value = '';
            document.getElementById('addCoursePage').classList.add('active'); 
        }
        
        function closeAddCoursePage() { 
            document.getElementById('addCoursePage').classList.remove('active'); 
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_W = 800; const MAX_H = 450;
                    let w = img.width; let h = img.height;
                    if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } }
                    else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        }

        function addNewCourse() {
            const name = document.getElementById('newCourseName').value.trim();
            const desc = document.getElementById('newCourseDesc').value.trim();
            const fileInput = document.getElementById('newCourseImgFile');
            if(!name) { alert('Course name required'); return; }

            function finalize(imgUrl) {
                const ref = rtdb.ref('courses').push();
                ref.set({
                    name, desc: desc || 'Course description', heroImg: imgUrl,
                    subjects: {}
                }, (err) => {
                    if(!err) { 
                        closeAddCoursePage(); 
                        alert('Course saved successfully!'); 
                    } else {
                        alert('Error saving course: ' + err.message);
                    }
                });
            }

            if(fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], finalize);
            } else {
                finalize("https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?auto=format&fit=crop&q=80&w=800");
            }
        }

        function deleteCourse(key) { 
            if(confirm("Delete this course?")) {
                rtdb.ref('courses/' + key).remove(); 
            }
        }
        
        function deleteCurrentCourse() { 
            if(activeCourseKey) { 
                deleteCourse(activeCourseKey); 
                closeAdminSubjects(); 
            } 
        }

        function openAdminSubjects(courseKey) {
            if(!courseKey) return;
            activeCourseKey = courseKey;
            const course = coursesData[courseKey];
            if(course) {
                document.getElementById('adminCourseTitle').innerText = course.name;
                renderAdminSubjectsList();
                document.getElementById('adminSubjectsPage').classList.add('active');
            }
        }
        
        function closeAdminSubjects() { 
            document.getElementById('adminSubjectsPage').classList.remove('active'); 
        }

        function renderAdminSubjectsList() {
            const container = document.getElementById('adminSubjectsList');
            if(!container) return;
            container.innerHTML = '';
            if(!activeCourseKey || !coursesData[activeCourseKey]) return;
            
            const subs = coursesData[activeCourseKey].subjects || {};
            const subKeys = Object.keys(subs);

            if(subKeys.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No subjects added yet.</p>';
                return;
            }

            subKeys.forEach(sub => {
                container.innerHTML += `
                    <div class="admin-row">
                        <span style="font-weight:bold;">${sub}</span>
                        <div style="display:flex; gap:6px;">
                            <button class="icon-btn" onclick="openAdminLectures('${sub}')">Manage Lectures</button>
                            <button class="icon-btn" style="background:#8b0000;" onclick="deleteSubject('${sub}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function addNewSubject() {
            const subName = document.getElementById('newSubjectName').value.trim();
            if(!subName) { alert('Subject name required'); return; }
            rtdb.ref(`courses/${activeCourseKey}/subjects/${subName}`).set({ lectures: [] }, (err) => {
                if(!err) { 
                    document.getElementById('newSubjectName').value = ''; 
                    alert('Subject added!');
                    renderAdminSubjectsList();
                }
            });
        }

        function deleteSubject(subName) {
            if(confirm(`Delete subject ${subName}?`)) {
                rtdb.ref(`courses/${activeCourseKey}/subjects/${subName}`).remove(() => {
                    renderAdminSubjectsList();
                });
            }
        }

        function openAdminLectures(subName) {
            activeSubjectName = subName;
            document.getElementById('adminSubjectTitleHeader').innerText = subName;
            renderAdminLecturesList();
            document.getElementById('adminLecturesPage').classList.add('active');
        }

        function renderAdminLecturesList() {
            const container = document.getElementById('adminLecturesList');
            if(!container) return;
            container.innerHTML = '';
            if(!activeCourseKey || !activeSubjectName) return;

            const subData = coursesData[activeCourseKey].subjects[activeSubjectName] || {};
            let lectures = subData.lectures || [];

            if(lectures.length === 0) {
                container.innerHTML = '<p style="color:#777; font-size:12px;">No lectures added yet.</p>';
                return;
            }

            lectures.forEach((lec, idx) => {
                container.innerHTML += `
                    <div class="admin-row">
                        <span style="flex:1;"><b>${lec.title}</b></span>
                        <button class="icon-btn" onclick="openEditLecturePage(${idx})">Edit</button>
                    </div>
                `;
            });
        }

        function openAddLecturePage() {
            document.getElementById('lectureFormHeading').innerText = "Add Lecture";
            document.getElementById('editingLecIdx').value = "";
            document.getElementById('lecFormTitle').value = "";
            document.getElementById('lecFormDesc').value = "";
            document.getElementById('lecFormDuration').value = "45:00";
            document.getElementById('lecFormVideoUrl').value = "";
            document.getElementById('lecFormThumbUrl').value = "";
            document.getElementById('lecFormNotesUrl').value = "";
            document.getElementById('lecFormQuizUrl').value = "";
            document.getElementById('deleteLecBtn').style.display = "none";
            document.getElementById('editLecturePage').classList.add('active');
        }

        function openEditLecturePage(idx) {
            const lec = coursesData[activeCourseKey].subjects[activeSubjectName].lectures[idx];
            document.getElementById('lectureFormHeading').innerText = "Edit Lecture";
            document.getElementById('editingLecIdx').value = idx;
            document.getElementById('lecFormTitle').value = lec.title;
            document.getElementById('lecFormDesc').value = lec.desc || '';
            document.getElementById('lecFormDuration').value = lec.duration || '45:00';
            document.getElementById('lecFormVideoUrl').value = lec.videoUrl || '';
            document.getElementById('lecFormThumbUrl').value = lec.thumb || '';
            document.getElementById('lecFormNotesUrl').value = lec.notesUrl || '';
            document.getElementById('lecFormQuizUrl').value = lec.quizUrl || '';
            document.getElementById('deleteLecBtn').style.display = "block";
            document.getElementById('editLecturePage').classList.add('active');
        }

        function closeEditLecturePage() {
            document.getElementById('editLecturePage').classList.remove('active');
        }

        function saveLectureData() {
            const idx = document.getElementById('editingLecIdx').value;
            const title = document.getElementById('lecFormTitle').value.trim();
            const desc = document.getElementById('lecFormDesc').value.trim();
            const duration = document.getElementById('lecFormDuration').value.trim();
            const videoUrl = document.getElementById('lecFormVideoUrl').value.trim();
            const thumbUrl = document.getElementById('lecFormThumbUrl').value.trim();
            const notesUrl = document.getElementById('lecFormNotesUrl').value.trim();
            const quizUrl = document.getElementById('lecFormQuizUrl').value.trim();

            if(!title || !videoUrl) {
                alert('Lecture title and Direct Video URL are required.');
                return;
            }

            const subData = coursesData[activeCourseKey].subjects[activeSubjectName];
            let lectures = subData.lectures ? [...subData.lectures] : [];

            const lecObj = {
                title, desc, duration, videoUrl, 
                thumb: thumbUrl || coursesData[activeCourseKey].heroImg, 
                notesUrl, quizUrl
            };

            if(idx !== "") {
                lectures[idx] = lecObj;
            } else {
                lectures.push(lecObj);
            }

            rtdb.ref(`courses/${activeCourseKey}/subjects/${activeSubjectName}/lectures`).set(lectures, (err) => {
                if(!err) {
                    closeEditLecturePage();
                    alert('Lecture saved successfully!');
                    renderAdminLecturesList();
                } else {
                    alert('Error: ' + err.message);
                }
            });
        }

        function deleteCurrentLecture() {
            if(confirm("Delete this lecture?")) {
                const idx = document.getElementById('editingLecIdx').value;
                const subData = coursesData[activeCourseKey].subjects[activeSubjectName];
                let lectures = subData.lectures ? [...subData.lectures] : [];
                lectures.splice(idx, 1);

                rtdb.ref(`courses/${activeCourseKey}/subjects/${activeSubjectName}/lectures`).set(lectures, (err) => {
                    if(!err) {
                        closeEditLecturePage();
                        renderAdminLecturesList();
                    }
                });
            }
        }
    </script>
